# Servizi del progetto: il database e lo strumento di conversione e caricamento.
#
# Prerequisiti: le variabili POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD e
# INGEST_DB_DSN definite nell'ambiente o in un file .env accanto a questo file.
#
# Avvio:
#   docker compose up -d db
#   docker compose run --rm ingest python -m src.database.ingest DatiElaborati --tutte

services:
  # Database PostgreSQL con pgvector. La porta e' pubblicata sul solo loopback
  # dell'host. I due file SQL montati in docker-entrypoint-initdb.d creano schema
  # e ruoli al primo avvio del volume.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/setup_roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
    networks:
      - biomech

  # Conversione e caricamento. L'immagine viene costruita dal Dockerfile e monta
  # il progetto in /app. Appartiene al profilo "tools", quindi non parte insieme
  # al database ma solo con `docker compose run`.
  ingest:
    build: .
    environment:
      INGEST_DB_DSN: ${INGEST_DB_DSN}
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      - db
    networks:
      - biomech
    profiles: [ "tools" ]

networks:
  biomech:
    driver: bridge

volumes:
  pgdata:
