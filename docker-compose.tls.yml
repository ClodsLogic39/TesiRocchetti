# Override che cifra il canale fra i client e PostgreSQL.
#
# Monta certificato e chiave nel contenitore del database e riavvia postgres con
# ssl attivo.
#
# Prerequisiti: certificato e chiave presenti in ./certs, con la chiave leggibile
# al solo proprietario, e sslmode=require nella DSN dei client.
#
#   mkdir -p certs
#   openssl req -new -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout certs/server.key -out certs/server.crt -subj "/CN=localhost"
#   chmod 600 certs/server.key
#
# Avvio:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --force-recreate db

services:
  db:
    volumes:
      - ./certs/server.crt:/etc/ssl/server.crt:ro
      - ./certs/server.key:/etc/ssl/server.key:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/server.crt
      - -c
      - ssl_key_file=/etc/ssl/server.key
